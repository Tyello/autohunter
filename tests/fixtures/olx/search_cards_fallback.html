<!--
  Fixture sintetica para o caminho de fallback de cards do OLX
  (`app/scrapers/olx.py:_fallback_parse_from_cards`, ~linha 757).

  Por que esta fixture é sintética (não capturada ao vivo):
  - As páginas de busca atuais da OLX usam streaming RSC
    (`self.__next_f.push(...)`), não o DOM classico de cards com
    `data-testid="adcard-link"` / `.olx-adcard__price` que este fallback
    espera (ver `test_fallback_card_parser_alone_finds_nothing_on_rsc_markup`
    em tests/test_olx_price_extraction.py — confirma 0 cards nesse formato).
  - O fallback so roda de fato quando o RSC/`__NEXT_DATA__` falham, e essa
    combinacao (RSC quebrado + HTML de card classico ainda no ar) nao esta
    disponivel como captura real neste repositorio.

  Por que os dados são confiáveis mesmo assim:
  - Os dois anúncios abaixo (título, preço, listId, URL, imagem) são os
    MESMOS dois anúncios reais já commitados em
    tests/fixtures/olx/search_rsc_price_nodes.html (Honda Fit 2021 - listId
    1503037487; Honda Fit 2005 - listId 1512208902). Só a casca de DOM
    (tags/seletores) é reconstruída para casar com o que o código de
    producao em app/scrapers/olx.py:762-786 seleciona
    (`a[data-testid="adcard-link"]`, `.olx-adcard__price`,
    `picture source`/`img`, fallback `style="background-image:url(...)"`).
-->
<!DOCTYPE html>
<html>
<body>
  <div class="olx-adcard-container">
    <div class="olx-adcard">
      <a data-testid="adcard-link" href="https://pb.olx.com.br/paraiba/autos-e-pecas/carros-vans-e-utilitarios/honda-fit-ex-s-ex-1-5-flex-flexone-16v-5p-aut-2021-1503037487">
        Honda Fit Ex/s/ex 1.5 Flex/flexone 16V 5P Aut. 2021
      </a>
      <picture>
        <source srcset="https://img.olx.com.br/images/73/730626405997082.webp" type="image/webp">
        <img src="https://img.olx.com.br/images/73/730626405997082.jpg" alt="Honda Fit 2021">
      </picture>
      <span class="olx-adcard__price">R$ 69.900</span>
    </div>

    <div class="olx-adcard">
      <a data-testid="adcard-link" href="https://sp.olx.com.br/sao-paulo-e-regiao/autos-e-pecas/carros-vans-e-utilitarios/honda-fit-lxl-1-4-1-4-flex-8v-16v-5p-mec-2005-1512208902">
        Honda Fit LXL 1.4/ 1.4 8v/16v 2005
      </a>
      <div style="background-image:url('https://img.olx.com.br/images/27/278617417194654.jpg')" class="olx-adcard__thumb"></div>
      <span class="olx-adcard__price">R$ 32.800</span>
    </div>
  </div>
</body>
</html>
